syntax = "proto3";

package collide;

option csharp_namespace = "GrpcNet.Generator.Tests.Collide";

message M {
  int32 v = 1;
}

// Method names that collide with the generated class itself.
service Echo {
  rpc Echo (M) returns (M);
  rpc Binder (M) returns (M);
  rpc GrpcNetTags (M) returns (M);
}

// A service named like the generated binder nested inside it.
service Binder {
  rpc Go (M) returns (M);
}

// A service named like the generated method tags nested inside it.
service GrpcNetTags {
  rpc Go (M) returns (M);
}
